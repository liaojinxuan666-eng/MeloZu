name: Build iOS App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Boost via Homebrew
        run: |
          brew install boost
          mkdir -p Sudachi/Sudachi/Dependencies/boost
          cp -R /opt/homebrew/include/boost/* Sudachi/Sudachi/Dependencies/boost/

      - name: Build Xcode project
        run: |
          xcodebuild -project Pomelo.xcodeproj \
                     -scheme Pomelo \
                     -sdk iphoneos \
                     -configuration Release \
                     -derivedDataPath build \
                     HEADER_SEARCH_PATHS='$(inherited) $(BUILT_PRODUCTS_DIR)/MoltenVK.framework/Headers' \
                     FRAMEWORK_SEARCH_PATHS='$(inherited) $(BUILT_PRODUCTS_DIR)' \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     build

      - name: Package into .ipa
        run: |
          mkdir -p Payload
          # 精准定位生成的 .app 文件，限制深度并只取第一个，防止匹配到多个导致 cp 报错
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" -type d | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            echo "❌ 错误：在 build/Build/Products/Release-iphoneos 下找不到 .app 文件！"
            exit 1
          fi
          
          echo "✅ 找到应用包: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -r MeloZu.ipa Payload/
          rm -rf Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MeloZu-ipa
          path: MeloZu.ipa
          retention-days: 5