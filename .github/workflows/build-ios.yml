name: Build iOS App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Boost via Homebrew
        run: |
          brew install boost
          mkdir -p Sudachi/Sudachi/Dependencies/boost
          cp -R /opt/homebrew/include/boost/* Sudachi/Sudachi/Dependencies/boost/

      - name: Install MoltenVK and Vulkan Headers
        run: |
          brew install molten-vk vulkan-headers
          MVK_INC=$(brew --prefix molten-vk)/include
          VK_INC=$(brew --prefix vulkan-headers)/include
          echo "✅ MoltenVK include: $MVK_INC"
          echo "✅ Vulkan  include: $VK_INC"
          ls "$MVK_INC/MoltenVK" || exit 1
          ls "$VK_INC/vulkan" || exit 1

          # 确保缺失的 vk_enum_string_helper.h 存在
          if [ ! -f "$VK_INC/vulkan/vk_enum_string_helper.h" ]; then
            echo "⚠️ 在 Homebrew vulkan-headers 中找不到 vk_enum_string_helper.h，正在下载..."
            mkdir -p /tmp/vk_fix/vulkan
            curl -L -o /tmp/vk_fix/vulkan/vk_enum_string_helper.h https://raw.githubusercontent.com/KhronosGroup/Vulkan-Headers/main/include/vulkan/vk_enum_string_helper.h
            echo "✅ 已下载到 /tmp/vk_fix"
          fi

      - name: Build Xcode project
        run: |
          MVK_INC=$(brew --prefix molten-vk)/include
          VK_INC=$(brew --prefix vulkan-headers)/include
          xcodebuild -project Pomelo.xcodeproj \
                     -scheme Pomelo \
                     -sdk iphoneos \
                     -configuration Release \
                     -derivedDataPath build \
                     "HEADER_SEARCH_PATHS=\$(inherited) $MVK_INC $VK_INC /tmp/vk_fix" \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     build

      - name: Package into .ipa
        run: |
          mkdir -p Payload
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" -type d | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            echo "❌ 错误：在 build/Build/Products/Release-iphoneos 下找不到 .app 文件！"
            exit 1
          fi
          
          echo "✅ 找到应用包: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -r MeloZu.ipa Payload/
          rm -rf Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MeloZu-ipa
          path: MeloZu.ipa
          retention-days: 5