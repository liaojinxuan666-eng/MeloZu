name: Build MeloZu

on:
  workflow_dispatch:

jobs:
  compile-ipa:
    runs-on: macos-15 # 必须用 macOS 15 (Xcode 16)

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Clone MeloNX 2.6 Source
        run: |
          git clone --depth 1 --branch 2.6 https://git.ryujinx.app/projects/MeloNX.git melonx-src

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install iOS Workload
        run: dotnet workload install ios

      - name: Compile Ryujinx Core (C#)
        run: |
          cd melonx-src
          dotnet publish src/Ryujinx.Library -c Release -r ios-arm64 -p:ExtraDefineConstants=DISABLE_UPDATER --self-contained true

      # 关键步骤：自动修复源码中的编译错误
      - name: Patch Source Code for Xcode 16 Compatibility
        run: |
          cat > patch.py << 'EOF'
          import os
          import re

          # 1. 修复 Toolbar 的 iOS 26 API 问题
          p = 'melonx-src/src/MeloNX/MeloNX/UI/Main/GamesList/Elements/GamesListView+ToolBar.swift'
          if os.path.exists(p):
              with open(p, 'r') as f: c = f.read()
              c = c.replace('.sharedBackgroundVisibility(.hidden)', '')
              with open(p, 'w') as f: f.write(c)

          # 2. 修复 RyujinxController 的字符串拼接语法错误
          p = 'melonx-src/src/MeloNX/MeloNX/Core/RyujinxController.swift'
          if os.path.exists(p):
              with open(p, 'r') as f: c = f.read()
              c = c.replace("\(game?.titleName ?+ \"'s\", default: \"all\")", "\(game?.titleName ?? \"all\")")
              with open(p, 'w') as f: f.write(c)

          # 3. 彻底修复 EmulationView 的初始化权限错误（暴力法：找到 init(game: 的位置，往前清掉 private）
          p = 'melonx-src/src/MeloNX/MeloNX/UI/Emulation/EmulationView.swift'
          if os.path.exists(p):
              with open(p, 'r') as f:
                  lines = f.readlines()
              
              for i, line in enumerate(lines):
                  if 'init(game:' in line:
                      # 往前看最多10行，把所有 private 和 fileprivate 删掉
                      j = i
                      count = 0
                      while j >= 0 and count < 10:
                          lines[j] = lines[j].replace('private', '').replace('fileprivate', '')
                          if 'init' in lines[j] or 'func' in lines[j] or 'struct' in lines[j] or 'extension' in lines[j]:
                              break
                          j -= 1
                          count += 1
                      break # 只处理第一个找到的 init
              
              with open(p, 'w') as f:
                  f.writelines(lines)

          # 4. 修复部署目标版本过高
          p = 'melonx-src/src/MeloNX/MeloNX.xcodeproj/project.pbxproj'
          if os.path.exists(p):
              with open(p, 'r') as f: c = f.read()
              c = c.replace('IPHONEOS_DEPLOYMENT_TARGET = 26.2;', 'IPHONEOS_DEPLOYMENT_TARGET = 15.0;')
              with open(p, 'w') as f: f.write(c)

          print('Patch applied successfully!')
          EOF
          python3 patch.py

      - name: Build iOS App with Xcode
        run: |
          cd melonx-src
          XCODE_PROJ=$(find . -name "*.xcodeproj" | head -n 1)
          echo "Found Xcode Project: $XCODE_PROJ"
          cd $(dirname "$XCODE_PROJ")
          
          SCHEME=$(xcodebuild -list -project $(basename "$XCODE_PROJ") | grep -A 5 "Schemes:" | tail -n +2 | head -n 1 | xargs)
          echo "Using Scheme: $SCHEME"
          
          # 强制使用 Swift 5.0 以避免 Swift 6 的严格并发检查，并覆盖 Bundle ID
          xcodebuild -project $(basename "$XCODE_PROJ") -scheme "$SCHEME" -configuration Release -sdk iphoneos -derivedDataPath build PRODUCT_BUNDLE_IDENTIFIER="com.melozu.stossy11" SWIFT_VERSION=5.0 CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          cd melonx-src
          mkdir -p Payload
          find . -name "*.app" -type d -exec cp -R {} Payload/ \;
          zip -r MeloZu.ipa Payload
          mv MeloZu.ipa $GITHUB_WORKSPACE/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MeloZu-unsigned-ipa
          path: MeloZu.ipa