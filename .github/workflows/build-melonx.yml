name: Import MeloNX 2.6

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-source:
    runs-on: macos-15

    steps:
      - name: Checkout MeloZu
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone MeloNX 2.6
        run: |
          git clone --depth 1 --branch 2.6 https://git.ryujinx.app/projects/MeloNX.git melonx-src

      - name: Copy MeloNX source into MeloZu
        run: |
          rm -rf src
          rm -f Ryujinx.sln Directory.Packages.props global.json nuget.config

          cp -R melonx-src/src .

          for f in Ryujinx.sln Directory.Packages.props global.json nuget.config; do
            if [ -f "melonx-src/$f" ]; then
              cp "melonx-src/$f" .
            fi
          done

          rm -rf melonx-src

          echo "===== MeloZu source imported ====="
          ls -la
          echo "===== Source directories ====="
          find src -maxdepth 1 -type d | sort

      - name: Commit MeloNX 2.6 source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Import MeloNX 2.6 source"
          git push