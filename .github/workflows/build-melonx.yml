name: Build MeloZu

on:
  workflow_dispatch:

jobs:
  compile-ipa:
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Clone MeloNX 2.6 Source
        run: |
          git clone --depth 1 --branch 2.6 https://git.ryujinx.app/projects/MeloNX.git melonx-src

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install iOS Workload
        run: dotnet workload install ios

      - name: Compile Ryujinx Core (C#)
        run: |
          cd melonx-src
          dotnet publish src/Ryujinx.Library -c Release -r ios-arm64 -p:ExtraDefineConstants=DISABLE_UPDATER --self-contained true

      - name: Build iOS App with Xcode
        run: |
          cd melonx-src
          XCODE_PROJ=$(find . -name "*.xcodeproj" | head -n 1)
          echo "Found Xcode Project: $XCODE_PROJ"
          cd $(dirname "$XCODE_PROJ")
          
          SCHEME=$(xcodebuild -list -project $(basename "$XCODE_PROJ") | grep -A 5 "Schemes:" | tail -n +2 | head -n 1 | xargs)
          echo "Using Scheme: $SCHEME"
          
          # 只在这里通过 PRODUCT_BUNDLE_IDENTIFIER 参数修改包名，不碰源码文件
          xcodebuild -project $(basename "$XCODE_PROJ") -scheme "$SCHEME" -configuration Release -sdk iphoneos -derivedDataPath build PRODUCT_BUNDLE_IDENTIFIER="com.melozu.stossy11" CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          cd melonx-src
          mkdir -p Payload
          find . -name "*.app" -type d -exec cp -R {} Payload/ \;
          zip -r MeloZu.ipa Payload
          mv MeloZu.ipa $GITHUB_WORKSPACE/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MeloZu-unsigned-ipa
          path: MeloZu.ipa