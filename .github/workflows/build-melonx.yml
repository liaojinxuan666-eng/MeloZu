name: Build MeloZu Core

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-core:
    runs-on: macos-15

    steps:
      - name: Checkout MeloZu
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install iOS Workload
        run: |
          dotnet workload install ios

      - name: Verify MeloZu Source
        run: |
          echo "===== Repository ====="
          pwd

          echo "===== Source ====="
          test -d src
          echo "src/ found"

          echo "===== Ryujinx.Library ====="
          test -f src/Ryujinx.Library/Ryujinx.Library.csproj
          echo "Ryujinx.Library.csproj found"

          echo "===== MeloZu Swift ====="
          test -f src/MeloNX/MeloNX/Core/Ryujinx.swift
          echo "Ryujinx.swift found"

          echo "===== Project Count ====="
          find src -name "*.csproj" | wc -l

      - name: Show .NET and Xcode
        run: |
          echo "===== .NET ====="
          dotnet --version

          echo "===== Xcode ====="
          xcodebuild -version

          echo "===== SDK ====="
          xcrun --sdk iphoneos --show-sdk-path

      - name: Restore MeloZu Core
        run: |
          dotnet restore \
            src/Ryujinx.Library/Ryujinx.Library.csproj \
            -r ios-arm64

      - name: Build MeloZu Core
        run: |
          dotnet publish \
            src/Ryujinx.Library/Ryujinx.Library.csproj \
            -c Release \
            -r ios-arm64 \
            -p:ExtraDefineConstants=DISABLE_UPDATER \
            --self-contained true

      - name: Verify NativeAOT Output
        run: |
          echo "===== Searching NativeAOT Output ====="

          find src/Ryujinx.Library/bin/Release \
            -type f \
            \( -name "*.dylib" -o -name "*.framework" \) \
            | sort

          echo "===== Build Finished ====="

      - name: Commit Build Metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git status --short

          git add -A

          if git diff --cached --quiet; then
            echo "No repository changes."
            exit 0
          fi

          git commit -m "Prepare MeloZu core build"
          git push